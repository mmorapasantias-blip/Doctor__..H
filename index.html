
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOCTOR H 🌪️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background:
        radial-gradient(circle at 20% 20%,
          #2879bd 0%, transparent 35%),
        radial-gradient(circle at 80% 70%,
          #7545d6 0%, transparent 35%),
        linear-gradient(135deg, #071b40, #087ca7, #111747);
      overflow-x: hidden;
      padding: 35px 15px;
    }

    /* Huracanes decorativos */
    .huracan {
      position: fixed;
      font-size: 110px;
      opacity: 0.20;
      z-index: -1;
      animation: girar 18s linear infinite;
      pointer-events: none;
    }

    .h1 {
      top: 8%;
      left: 3%;
    }

    .h2 {
      right: 3%;
      bottom: 8%;
      font-size: 150px;
      animation-duration: 25s;
    }

    .h3 {
      top: 45%;
      right: 12%;
      font-size: 70px;
      animation-duration: 14s;
    }

    @keyframes girar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    header {
      padding: 25px 10px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 75px);
      margin: 0;
      color: #ffffff;
      text-shadow:
        0 0 10px #4deaff,
        0 0 25px #168bff,
        3px 4px 0 #342078;
      letter-spacing: 3px;
    }

    .subtitulo {
      font-size: 19px;
      color: #c9f6ff;
      margin-top: 15px;
    }

    .juego {
      max-width: 650px;
      margin: 25px auto;
      padding: 35px 22px;
      border: 2px solid rgba(255,255,255,0.45);
      border-radius: 25px;
      background: rgba(8, 24, 65, 0.72);
      box-shadow: 0 0 35px rgba(63, 211, 255, 0.35);
      backdrop-filter: blur(8px);
    }

    .icono {
      font-size: 65px;
      margin: 5px;
    }

    h2 {
      font-size: 32px;
      color: #83f3ff;
      margin: 10px 0;
    }

    .descripcion {
      font-size: 17px;
      line-height: 1.7;
      color: #e5faff;
    }

    .boton {
      display: inline-block;
      margin-top: 20px;
      padding: 17px 42px;
      border-radius: 50px;
      background: linear-gradient(90deg, #7b42ed, #13bce8);
      color: white;
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 0 22px #31cfff;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .boton:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px #83f3ff;
    }

    .etiqueta {
      display: inline-block;
      padding: 9px 16px;
      margin-top: 20px;
      border-radius: 20px;
      background: rgba(83, 226, 255, 0.13);
      border: 1px solid #64eaff;
      color: #b9f7ff;
      font-size: 13px;
    }

    footer {
      margin-top: 35px;
      color: #c7eaff;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .huracan {
        font-size: 75px;
      }

      .h2 {
        font-size: 100px;
      }

      .juego {
        padding: 28px 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .huracan {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="huracan h1">🌀</div>
  <div class="huracan h2">🌪️</div>
  <div class="huracan h3">🌀</div>

  <header>
    <h1>🌪️ DOCTOR H 🌪️</h1>
    <p class="subtitulo">
      ¡Prepárate para una aventura llena de acción!
    </p>
  </header>

  <main class="juego">
    <div class="icono">⚡🌪️🎮</div>

    <h2>¡Misión Doctor H!</h2>

    <p class="descripcion">
      ¿Estás listo para el desafío?<br>
      Ayuda al doctor a superar los obstáculos
      y demuestra tus habilidades.
    </p>

    <a
      class="boton"
      href="https://scratch.mit.edu/projects/1392114557/fullscreen/"
      target="_blank"
      rel="noopener noreferrer">
      🎮 ¡JUGAR AHORA!
    </a>

    <br>

    <span class="etiqueta">
      ⚡ ¡Que comience la aventura! ⚡
    </span>
  </main>

  <footer>
    <p>🌪️ DOCTOR H · Una aventura fuera de control 🌪️</p>
  </footer>

</body>
</html>
